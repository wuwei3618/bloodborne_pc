# macOS x86_64 build check (docs/MACOS.md): builds bb-probe and the GPU library on an Intel
# runner with the Homebrew packages a Mac uses, and runs the tests that need no GPU or game.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The renderer needs std::jthread in libc++ (Xcode 26, as for shadPS4); macOS 26 itself
      # is required on Apple silicon anyway (KosmicKrisp).
      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          c++ --version

      - name: Dependencies
        run: >-
          brew install cmake ninja pkgconf glslang vulkan-headers vulkan-loader sdl3 ffmpeg
          boost fmt magic_enum robin-map xxhash zydis miniz xbyak

      - name: Build, runtime tests
        run: BB_LTO=OFF bash build.sh --test

      - name: GPU library tests
        run: |
          ninja -C out/gpu motion-history-test ui-composition-test motion-shader-test
          for test in motion-history-test ui-composition-test motion-shader-test; do
            ./out/gpu/$test
          done

      - name: Python tests
        run: python3 -m unittest discover -s tests

      # All compile errors at once (build.sh stops at the first failing objects).
      - name: GPU library errors
        if: failure()
        run: |
          ninja -C out/gpu -k 0 bbgpu > out/gpu-all.log 2>&1 || true
          grep -E 'error:' out/gpu-all.log | sort | uniq -c | sort -rn | head -n 150 || true
          tail -n 60 out/gpu-all.log
