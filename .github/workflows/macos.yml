# macOS x86_64 (docs/MACOS.md). An Intel Mac builds bb-probe and the GPU library with the
# x86_64 Homebrew, runs the tests that need no GPU or game, and packages the build with the
# libraries it uses (artifact bbport-macos-x86_64). An Apple silicon Mac without that Homebrew
# then runs the packaged programs and tests as a user's Mac does: x86_64 under Rosetta 2.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel:
    name: Intel (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The renderer needs std::jthread in libc++ (Xcode 26, as for shadPS4).
      - name: Toolchain
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          c++ --version

      - name: Dependencies
        run: >-
          brew install cmake ninja pkgconf glslang vulkan-headers vulkan-loader sdl3 ffmpeg
          boost fmt magic_enum robin-map xxhash zydis miniz xbyak

      - name: Build, runtime tests
        run: BB_LTO=OFF bash build.sh --test

      - name: GPU library tests
        run: |
          ninja -C out/gpu motion-history-test ui-composition-test motion-shader-test hle-thread-test submission-gate-test
          for test in motion-history-test ui-composition-test motion-shader-test hle-thread-test submission-gate-test; do
            ./out/gpu/$test
          done

      - name: Python tests
        run: python3 -m unittest discover -s tests

      - name: Package
        run: bash packaging/macos_package.sh --tests

      - uses: actions/upload-artifact@v4
        with:
          name: bbport-macos-x86_64
          path: dist/bbport-macos-x86_64.tar.gz
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-tests
          path: dist/macos-x86_64-tests.tar.gz
          compression-level: 0
          retention-days: 7

      # All compile errors at once (build.sh stops at the first failing objects).
      - name: GPU library errors
        if: failure() && hashFiles('out/gpu/build.ninja') != ''
        run: |
          ninja -C out/gpu -k 0 bbgpu > out/gpu-all.log 2>&1 || true
          grep -E 'error:' out/gpu-all.log | sort | uniq -c | sort -rn | head -n 150 || true
          tail -n 60 out/gpu-all.log

  apple-silicon:
    name: Apple silicon (x86_64 under Rosetta 2)
    needs: intel
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rosetta 2
        run: |
          sw_vers
          sudo softwareupdate --install-rosetta --agree-to-license

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Unpack
        run: |
          tar -xzf dist/macos-x86_64-tests.tar.gz
          tar -C dist -xzf dist/bbport-macos-x86_64.tar.gz
          file out/bb-probe dist/bbport-macos-x86_64/bin/lib/* | sed 's/:.*Mach-O/: Mach-O/'
          echo "x86_64 processes translated by Rosetta 2: $(arch -x86_64 sysctl -n sysctl.proc_translated)"

      # As build.sh --test, translated by Rosetta 2 (also puts the libraries in its cache).
      - name: Runtime tests
        run: |
          for test in pad-test runtime-test file-mods-test sema-test content-test; do
            ./out/$test
          done

      - name: GPU library tests
        run: |
          for test in motion-history-test ui-composition-test motion-shader-test hle-thread-test submission-gate-test; do
            ./out/gpu/$test
          done

      - name: Python tests
        run: python3 -m unittest discover -s tests

      # The package as a user unpacks it: bb-probe starts (its usage, exit status 1) with only
      # the libraries it carries.
      - name: Package
        run: |
          cd dist/bbport-macos-x86_64
          status=0; bin/bb-probe > usage.txt 2>&1 || status=$?
          cat usage.txt
          test "$status" = 1 && grep -q Usage usage.txt

      # Vulkan without the game through the package's KosmicKrisp: the driver must load under
      # Rosetta 2 and create an instance. The runner's virtual GPU has no Metal 4, so no device
      # there is expected; a Mac prints its GPU and PASS.
      - name: Vulkan through KosmicKrisp
        timeout-minutes: 5
        run: |
          cd dist/bbport-macos-x86_64
          status=0; VK_LOADER_DEBUG=error,warn,driver bin/bb-probe --vulkan-only > vulkan.txt 2>&1 || status=$?
          cat vulkan.txt
          grep -q 'readback PASS' vulkan.txt ||
            { test "$status" = 1 && grep -q 'vkEnumeratePhysicalDevices.*returned -3' vulkan.txt; }
